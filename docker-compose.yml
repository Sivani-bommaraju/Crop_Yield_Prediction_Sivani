services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: yieldsense-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: yieldsense-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped